# Profiles:
#   prod     — Postgres + Flask CRM (gunicorn) production-style stack
#   crm      — Redis for Flask Celery/cache (product path)
#   matching — Neo4j + Redis + ingestor/matcher/api/chatbot (experimental)
#
# Examples:
#   docker compose --profile prod up -d --build
#   docker compose --profile crm up -d
#   docker compose --profile matching up -d --build
#   docker compose --profile prod down

services:
  db:
    # pgvector build of Postgres 16 — the embeddings migration runs
    # `CREATE EXTENSION vector`, which plain postgres:16-alpine cannot satisfy
    # (it has no $libdir/vector, leaving an orphaned extension record that
    # breaks every read of property_embeddings and even pg_dump).
    image: pgvector/pgvector:pg16
    container_name: gptvli-db
    profiles: ["prod"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gptvli}
      # Required for prod — no weak default password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gptvli}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gptvli} -d ${POSTGRES_DB:-gptvli}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gptvli-web
    profiles: ["prod"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    # .env supplies app secrets (ADMIN_PASSWORD, provider API keys). The explicit
    # `environment:` block below is applied after env_file, so container-network
    # wiring (DATABASE_URL, REDIS_URL, ENABLE_SCHEDULER) always wins over .env.
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gptvli}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gptvli}
      USE_TAILWIND_CDN: "0"
      ENABLE_CSRF: ${ENABLE_CSRF:-1}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      MIGRATION_RETRIES: ${MIGRATION_RETRIES:-10}
      MIGRATION_RETRY_DELAY: ${MIGRATION_RETRY_DELAY:-3}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      GEOCODE_PROVIDER: ${GEOCODE_PROVIDER:-auto}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      # Celery beat owns scheduling; never start an in-process scheduler in web.
      ENABLE_SCHEDULER: "0"
      READYZ_REQUIRE_REDIS: ${READYZ_REQUIRE_REDIS:-1}
      DOCUMENT_STORAGE_ROOT: ${DOCUMENT_STORAGE_ROOT:-/app/instance/document_store}
      # Maskan scraper integration. Reached over the shared network by DNS alias,
      # never localhost — 127.0.0.1 inside this container is the web container.
      # Hardcoded (not ${...}) on purpose: .env holds the HOST value
      # http://127.0.0.1:8001 for local dev, and inside this container 127.0.0.1
      # is the web container itself. Container wiring must win over .env, same as
      # DATABASE_URL/REDIS_URL above.
      MASKAN_LIVE_API_BASE_URL: http://maskan-api:8000
      MASKAN_LIVE_API_KEY: ${MASKAN_LIVE_API_KEY:-}
      MASKAN_LIVE_API_KEY_HEADER: ${MASKAN_LIVE_API_KEY_HEADER:-X-API-Key}
      MASKAN_LIVE_TIMEOUT_SECONDS: ${MASKAN_LIVE_TIMEOUT_SECONDS:-15}
      MASKAN_LIVE_INCREMENTAL_LIMIT: ${MASKAN_LIVE_INCREMENTAL_LIMIT:-200}
    volumes:
      - uploads_data:/app/static/uploads
      - document_store_data:/app/instance/document_store
    networks:
      default: {}
      maskan_shared: {}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Gate on DB-backed readiness, not process liveness alone
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Celery worker — executes queued tasks (matching, SMS, scoring, digests).
  # RUN_MIGRATIONS=0: web is the single migration owner, so workers never race it.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gptvli-worker
    profiles: ["prod"]
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gptvli}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gptvli}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      RUN_MIGRATIONS: "0"
      ENABLE_SCHEDULER: "0"
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      GEOCODE_PROVIDER: ${GEOCODE_PROVIDER:-auto}
      DOCUMENT_STORAGE_ROOT: ${DOCUMENT_STORAGE_ROOT:-/app/instance/document_store}
      # Worker executes the maskan sync task, so it needs the same scraper wiring.
      # Hardcoded for the same reason as web: .env's 127.0.0.1:8001 is host-only.
      MASKAN_LIVE_API_BASE_URL: http://maskan-api:8000
      MASKAN_LIVE_API_KEY: ${MASKAN_LIVE_API_KEY:-}
      MASKAN_LIVE_API_KEY_HEADER: ${MASKAN_LIVE_API_KEY_HEADER:-X-API-Key}
      MASKAN_LIVE_TIMEOUT_SECONDS: ${MASKAN_LIVE_TIMEOUT_SECONDS:-15}
      MASKAN_LIVE_INCREMENTAL_LIMIT: ${MASKAN_LIVE_INCREMENTAL_LIMIT:-200}
      # Embedding API key rotation pool — must be explicit here because the
      # `environment:` block is applied after env_file and any key named here
      # without a value would shadow the env_file value with an empty string.
      # These pass-throughs preserve what env_file loaded.
      GEMINI_EMBED_API_KEYS: ${GEMINI_EMBED_API_KEYS:-}
      GEMINI_EMBED_API_KEY: ${GEMINI_EMBED_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - uploads_data:/app/static/uploads
      - document_store_data:/app/instance/document_store
    networks:
      default: {}
      maskan_shared: {}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    command:
      - celery
      - -A
      - celery_app.celery_app
      - worker
      - -l
      - ${CELERY_LOG_LEVEL:-info}
      - --concurrency
      - "${CELERY_CONCURRENCY:-2}"
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app.celery_app inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  # Celery beat — SOLE scheduler for periodic jobs. Exactly one replica.
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gptvli-beat
    profiles: ["prod"]
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gptvli}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gptvli}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      RUN_MIGRATIONS: "0"
      ENABLE_SCHEDULER: "0"
      # Beat only dispatches task names (the worker does the HTTP calls), but keep
      # the value container-correct so .env's host URL can never leak in here.
      MASKAN_LIVE_API_BASE_URL: http://maskan-api:8000
      # Embedding keys: beat doesn't call the API itself, but the provider is
      # imported at startup and will log a warning if keys are absent. Pass them
      # through so the startup check stays clean.
      GEMINI_EMBED_API_KEYS: ${GEMINI_EMBED_API_KEYS:-}
      GEMINI_EMBED_API_KEY: ${GEMINI_EMBED_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - beat_data:/app/instance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    # Override the image-level HTTP /healthz probe: beat serves no HTTP port, so
    # the inherited check always fails. Probe scheduler process liveness instead
    # (no procps in the slim image, so scan /proc with stdlib python).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys;
          sys.exit(0 if any('beat' in open('/proc/'+p+'/cmdline','rb').read().decode('utf-8','ignore')
          for p in os.listdir('/proc') if p.isdigit()) else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command:
      - celery
      - -A
      - celery_app.celery_app
      - beat
      - -l
      - ${CELERY_LOG_LEVEL:-info}
      - --schedule
      - /app/instance/celerybeat-schedule

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["crm", "matching", "prod"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.13
    container_name: neo4j
    profiles: ["matching"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/changemeplease
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/conf:/conf
      - ./neo4j/plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474/"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Ingestor — experimental matching stack
  ingestor:
    build:
      context: ./ingestor
      dockerfile: Dockerfile
    container_name: ingestor
    profiles: ["matching"]
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=changemeplease
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - LOG_LEVEL=info
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ingestor:/app
      - ./ingestor/logs:/app/logs
    restart: unless-stopped

  # Matcher — experimental matching stack
  matcher:
    build:
      context: ./matcher
      dockerfile: Dockerfile
    container_name: matcher
    profiles: ["matching"]
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=changemeplease
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - WORKER_CONCURRENCY=4
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./matcher:/app
      - ./matcher/logs:/app/logs
    restart: unless-stopped

  # API — experimental matching stack
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    profiles: ["matching"]
    ports:
      - "3000:3000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=changemeplease
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
      - ./api/logs:/app/logs
    restart: unless-stopped

  # Chatbot — experimental matching stack
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: chatbot
    profiles: ["matching"]
    ports:
      - "8002:8002"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=changemeplease
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - LOG_LEVEL=info
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./chatbot:/app
      - ./chatbot/logs:/app/logs
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  postgres_data:
  uploads_data:
  document_store_data:
  beat_data:

networks:
  # Cross-project bridge shared with the Maskan scraper stack. Declared
  # identically in both compose files, so whichever stack starts first creates
  # it and the other joins.
  maskan_shared:
    name: maskan_shared
